name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    name: unit (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      # Some tests run real git in a temporary repository, to fingerprint a project.
      - name: git identity for the test repositories
        run: |
          git config --global user.email ci@example.com
          git config --global user.name ci
          git --version
      - name: typecheck
        run: npm run typecheck
      - name: unit tests
        run: npm test

  # The real thing: a real dsh process, a throwaway DSH_HOME, a real browser and real git. This is the job that would
  # have caught a slot name that dsh does not publish, or a factory dsh refuses to activate.
  e2e:
    name: e2e (real dsh)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: install the browser
        run: npx playwright install --with-deps chromium
      - name: git identity for the test repository
        run: |
          git config --global user.email ci@example.com
          git config --global user.name ci
      - name: end-to-end against a real dsh
        run: npm run e2e
      - name: upload the failure screenshot
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-artifacts
          path: e2e/artifacts/
          if-no-files-found: ignore
          retention-days: 7